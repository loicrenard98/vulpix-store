# Après l'acceptation d'une publication : régénère catalog.json (lu par Vulpix).
name: catalog

on:
  push:
    branches: [main]
    paths: ['projects/**', 'tools/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Génération du catalogue
        shell: pwsh
        run: ./tools/build-catalog.ps1

      - name: Enregistrement
        run: |
          if git diff --quiet -- catalog.json; then
            echo "Catalogue inchangé."
            exit 0
          fi
          git config user.name "vulpix-store-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Catalogue mis à jour"
          git push
